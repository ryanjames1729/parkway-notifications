# Temporary: saves a copy of the closures page to the debug/page-snapshot
# branch so the parser can be developed against the real HTML.
name: Snapshot closures page

on: workflow_dispatch

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -A "Mozilla/5.0 parkway-notifications" -o /tmp/page.html \
            https://www.nps.gov/blri/planyourvisit/roadclosures.htm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug/page-snapshot
          git rm -rfq .
          cp /tmp/page.html page.html
          git add page.html
          git commit -qm "Snapshot of closures page"
          git push -f origin debug/page-snapshot
